name: validate

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validate plugin
        shell: bash
        run: |
          set +e
          python3 tools/validate_plugin.py 2>&1 | tee /tmp/axiom-validator.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            while IFS= read -r line; do
              echo "::error::$line"
            done < /tmp/axiom-validator.log
          fi
          exit "$status"
      - run: python3 -m unittest discover -s tests -v
      - run: npm install --no-save typescript@5.8.3
        working-directory: plugins/axiom/dashboard/web
      - run: npm run check
        working-directory: plugins/axiom/dashboard/web
      - run: npm run build
        working-directory: plugins/axiom/dashboard/web
      - run: git diff --exit-code -- plugins/axiom/dashboard/web/dist/app.js
      - run: cargo check --manifest-path plugins/axiom/dashboard/Cargo.toml --all-targets
      - run: cargo clippy --manifest-path plugins/axiom/dashboard/Cargo.toml --all-targets
      - run: cargo test --manifest-path plugins/axiom/dashboard/Cargo.toml
      - run: cargo build --release --manifest-path plugins/axiom/dashboard/Cargo.toml
