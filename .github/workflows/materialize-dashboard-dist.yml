name: Materialize dashboard dist

on:
  push:
    branches:
      - agent/fix-dashboard-v0.1.3
    paths:
      - .github/workflows/materialize-dashboard-dist.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build dashboard UI
        shell: bash
        run: |
          set -euo pipefail
          WEB=plugins/axiom/dashboard/web
          npx --yes -p typescript@5.9.3 tsc -p "$WEB/tsconfig.json"
          mkdir -p "$WEB/dist/vendor"
          curl -fsSL https://unpkg.com/react@18.3.1/umd/react.production.min.js -o "$WEB/dist/vendor/react.production.min.js"
          curl -fsSL https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js -o "$WEB/dist/vendor/react-dom.production.min.js"
          curl -fsSL https://unpkg.com/react@18.3.1/LICENSE -o "$WEB/dist/vendor/REACT-LICENSE.txt"
      - name: Commit generated assets
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -f plugins/axiom/dashboard/web/dist
          rm -rf .tmp-dashboard-dist
          git add -A .tmp-dashboard-dist || true
          git commit -m 'Materialize dashboard web assets'
          git push
