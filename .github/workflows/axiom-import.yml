name: axiom-import

on:
  push:
    branches:
      - agent/fix-dashboard-v0.1.3
    paths:
      - .axiom-import2/READY

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fix-dashboard-v0.1.3
          fetch-depth: 0
      - name: Reconstruct fixed v0.1.3 source
        shell: bash
        run: |
          set -euo pipefail
          cat .axiom-import2/part-*.b64 | base64 -d > /tmp/axiom-fixed.tar.xz
          tar -xJf /tmp/axiom-fixed.tar.xz
          rm -rf .axiom-import2 .axiom-staging
          rm -f .github/workflows/axiom-import.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Fix Axiom dashboard v0.1.3"
          git push origin HEAD:agent/fix-dashboard-v0.1.3
