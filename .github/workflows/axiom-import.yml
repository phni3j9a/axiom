name: axiom-import

on:
  push:
    branches:
      - agent/fix-dashboard-v0.1.3
    paths:
      - .axiom-import3/READY

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fix-dashboard-v0.1.3
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Reconstruct source delta
        shell: bash
        run: |
          set -euo pipefail
          cat .axiom-import3/part-*.b64 | base64 -d > /tmp/axiom-delta.tar.xz
          xz -t /tmp/axiom-delta.tar.xz
          tar -xJf /tmp/axiom-delta.tar.xz
      - name: Restore vendored React assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p plugins/axiom/dashboard/web/dist/vendor
          curl -fsSL https://unpkg.com/react@16.0.0/umd/react.production.min.js -o plugins/axiom/dashboard/web/dist/vendor/react.production.min.js
          curl -fsSL https://unpkg.com/react-dom@16.0.1/umd/react-dom.production.min.js -o plugins/axiom/dashboard/web/dist/vendor/react-dom.production.min.js
          curl -fsSL https://unpkg.com/react@16.0.0/LICENSE -o plugins/axiom/dashboard/web/dist/vendor/REACT-LICENSE.txt
      - name: Rebuild dashboard web bundle
        shell: bash
        run: |
          set -euo pipefail
          cd plugins/axiom/dashboard/web
          npm install --no-save --package-lock=false typescript@5.8.3
          npm run build
          rm -rf node_modules
      - name: Generate Rust lockfile
        shell: bash
        run: |
          set -euo pipefail
          cargo generate-lockfile --manifest-path plugins/axiom/dashboard/Cargo.toml
      - name: Commit reconstructed v0.1.3
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .axiom-import3 .axiom-import2 .axiom-staging
          git checkout HEAD -- .github/workflows/validate.yml .github/workflows/release.yml .github/workflows/axiom-import.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Fix Axiom dashboard v0.1.3"
          git push origin HEAD:agent/fix-dashboard-v0.1.3
