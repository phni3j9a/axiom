[package]
name = "axiom-dashboard"
version = "0.1.0"
edition = "2021"
description = "Local read-only observability dashboard bundled with the Axiom Codex plugin"
license = "MIT"
publish = false

[[bin]]
name = "axiom-dashboard"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
axum = { version = "0.8", features = ["http1", "json", "tokio"] }
clap = { version = "4.5", features = ["derive", "env"] }
futures-util = "0.3"
regex = "1.11"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.47", features = ["macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tokio-stream = { version = "0.1", features = ["sync"] }

[profile.release]
strip = true
lto = true
codegen-units = 1
panic = "abort"
